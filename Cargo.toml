[package]
name = "omwei-iot"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Semantic interoperability primitives for heterogeneous IoT systems"
repository = "https://github.com/Equinibrium/omwei_iot"
readme = "README.md"
keywords = ["iot", "semantic", "interoperability", "embedded", "telemetry"]
categories = ["embedded", "encoding", "network-programming"]

[lib]
name = "omwei_iot"
path = "src/lib.rs"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = "0.11"
serde_yaml = "0.9"
