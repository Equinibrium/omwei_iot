[package]
name = "omwei-iot"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "Semantic interoperability primitives for heterogeneous IoT systems"
repository = "https://github.com/Equinibrium/omwei_iot"
readme = "README.md"
exclude = ["tests/no_std_smoke/**", "examples/minimal-firmware/**"]
keywords = ["iot", "semantic", "interoperability", "embedded", "telemetry"]
categories = ["embedded", "encoding", "network-programming"]

[lib]
name = "omwei_iot"
path = "src/lib.rs"

[[bin]]
name = "omwei"
path = "src/bin/omwei.rs"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[features]
default = ["std"]
std = ["dep:serde", "dep:serde_json", "dep:serde_cbor", "dep:serde_yaml"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
serde_cbor = { version = "0.11", optional = true }
serde_yaml = { version = "0.9", optional = true }
