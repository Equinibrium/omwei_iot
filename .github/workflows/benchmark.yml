name: OMWEI IoT Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "registry/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/benchmark.yml"

permissions:
  contents: write

concurrency:
  group: omwei-iot-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release

      - name: Generate and smoke-check adapter PoC
        run: |
          cargo run --release --bin adapter_generator -- examples/adapter-poc/registry.yaml "$RUNNER_TEMP/omwei-adapter-poc"
          node --check "$RUNNER_TEMP/omwei-adapter-poc/tts_normalize_uplink.js"
          node tests/adapter_poc_smoke.js "$RUNNER_TEMP/omwei-adapter-poc/tts_normalize_uplink.js"
          python -m json.tool "$RUNNER_TEMP/omwei-adapter-poc/test_vectors.json" > /dev/null
          grep -q "ambient_temperature_mC" "$RUNNER_TEMP/omwei-adapter-poc/tts_normalize_uplink.js"
          grep -q "ambient_temperature_mC" "$RUNNER_TEMP/omwei-adapter-poc/telegraf_starlark.star"
          {
            cat <<'TELEGRAF_HEAD'
          [[inputs.exec]]
            commands = ["printf '{\"temp_c_dC\":235}'"]
            timeout = "5s"
            data_format = "json_v2"
            [[inputs.exec.json_v2]]
              [[inputs.exec.json_v2.field]]
                path = "temp_c_dC"
                type = "int"

          [[inputs.exec]]
            commands = ["printf '{\"temp_f_dF\":743}'"]
            timeout = "5s"
            data_format = "json_v2"
            [[inputs.exec.json_v2]]
              [[inputs.exec.json_v2.field]]
                path = "temp_f_dF"
                type = "int"

          [[inputs.exec]]
            commands = ["printf '{\"temp_c_dC\":235,\"temp_f_dF\":743,\"ambient_temperature_mC\":999}'"]
            timeout = "5s"
            data_format = "json_v2"
            [[inputs.exec.json_v2]]
              [[inputs.exec.json_v2.field]]
                path = "temp_c_dC"
                type = "int"
              [[inputs.exec.json_v2.field]]
                path = "temp_f_dF"
                type = "int"
              [[inputs.exec.json_v2.field]]
                path = "ambient_temperature_mC"
                type = "int"

          [[inputs.exec]]
            commands = ["printf '{\\"temp_c_dC\\":1000000}'"]
            timeout = "5s"
            data_format = "json_v2"
            [[inputs.exec.json_v2]]
              [[inputs.exec.json_v2.field]]
                path = "temp_c_dC"
                type = "int"

          [[inputs.exec]]
            commands = ["printf '{\\"temp_c_dC\\":\\"235\\"}'"]
            timeout = "5s"
            data_format = "json_v2"
            [[inputs.exec.json_v2]]
              [[inputs.exec.json_v2.field]]
                path = "temp_c_dC"
                type = "string"

          [[inputs.exec]]
            commands = ["printf '{\\"ambient_temperature_mC\\":999}'"]
            timeout = "5s"
            data_format = "json_v2"
            [[inputs.exec.json_v2]]
              [[inputs.exec.json_v2.field]]
                path = "ambient_temperature_mC"
                type = "int"

          [[processors.starlark]]
            source = '''
          TELEGRAF_HEAD
            cat "$RUNNER_TEMP/omwei-adapter-poc/telegraf_starlark.star"
            cat <<'TELEGRAF_TAIL'
          '''
          TELEGRAF_TAIL
          } > "$RUNNER_TEMP/telegraf-adapter-smoke.conf"
          docker run --rm \
            -v "$RUNNER_TEMP:/tmp/omwei:ro" \
            telegraf:1.36 \
            --config /tmp/omwei/telegraf-adapter-smoke.conf --test \
            | tee "$RUNNER_TEMP/telegraf-adapter-smoke.out"
          test "$(grep -c "ambient_temperature_mC=23500i" "$RUNNER_TEMP/telegraf-adapter-smoke.out")" -eq 2
          grep -q 'omwei_error="missing or ambiguous source fields"' "$RUNNER_TEMP/telegraf-adapter-smoke.out"
          grep -q 'omwei_error="source value must be integer"' "$RUNNER_TEMP/telegraf-adapter-smoke.out"
          grep -q 'omwei_error="canonical value outside descriptor range"' "$RUNNER_TEMP/telegraf-adapter-smoke.out"
      - name: Run benchmark
        run: cargo run --release --bin benchmark

      - name: Run comparison
        run: cargo run --release --bin compare

      - name: Publish benchmark result
        if: github.ref == 'refs/heads/main'
        run: |
          cp benchmark-results/benchmark.csv benchmarks/latest.csv
          {
            echo "Benchmark commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > benchmarks/latest-run.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/latest.csv benchmarks/latest-run.txt

          if git diff --cached --quiet; then
            echo "No benchmark result changes to commit."
            exit 0
          fi

          git commit -m "ci: publish latest benchmark results"
          git push

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: omwei-iot-benchmark-results
          path: |
            benchmark-results/**
            benchmarks/latest.csv
            benchmarks/latest-run.txt
            **/*.csv
          if-no-files-found: ignore
