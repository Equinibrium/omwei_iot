name: OMWEI IoT Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "registry/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/benchmark.yml"

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release

      - name: Run benchmark
        run: cargo run --release --bin benchmark

      - name: Run comparison
        run: cargo run --release --bin compare

      - name: Publish benchmark result
        run: |
          cp benchmark-results/benchmark.csv benchmarks/latest.csv
          {
            echo "Benchmark commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > benchmarks/latest-run.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/latest.csv benchmarks/latest-run.txt

          if git diff --cached --quiet; then
            echo "No benchmark result changes to commit."
            exit 0
          fi

          git commit -m "ci: publish latest benchmark results"
          git push

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: omwei-iot-benchmark-results
          path: |
            benchmark-results/**
            benchmarks/latest.csv
            benchmarks/latest-run.txt
            **/*.csv
          if-no-files-found: ignore
