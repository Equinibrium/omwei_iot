[package]
name = "omwei-minimal-firmware"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
omwei-iot = { path = "../..", default-features = false }
cortex-m-rt = "0.7"
panic-halt = "0.2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
